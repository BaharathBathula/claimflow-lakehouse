name: claimflow
version: "1.0.0"
config-version: 2

profile: claimflow
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  claimflow:
    staging:
      +schema: silver
      +materialized: view
      +tags: ["silver"]
    core:
      +schema: silver
      +materialized: table
      +tags: ["silver"]
    marts:
      +schema: gold
      +materialized: table
      +tags: ["gold"]

